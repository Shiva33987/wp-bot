# Nixpacks configuration for Railway to support Puppeteer / Chromium
[phases.setup]
aptPkgs = [
  "chromium",
  "libnss3",
  "libatk-1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "pango",
  "cairo"
]

[phases.build]
cmds = [
  "npm install"
]
